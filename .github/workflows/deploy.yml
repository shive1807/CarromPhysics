name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Emscripten ──────────────────────────────────────────────────────────
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache   # action manages its own cache here

      # ── Cache compiled raylib (FetchContent) so re-builds are fast ──────────
      - name: Cache CMake FetchContent deps
        uses: actions/cache@v4
        with:
          path: web-build/_deps
          key: cmake-web-deps-${{ hashFiles('CMakeLists.txt') }}-${{ runner.os }}

      # ── Configure & Build ───────────────────────────────────────────────────
      - name: Configure (Emscripten)
        run: emcmake cmake -B web-build -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: emmake cmake --build web-build --parallel 4

      # Emscripten outputs CarromPhysics.html — Pages serves index.html
      - name: Create index.html redirect
        run: cp web-build/CarromPhysics.html web-build/index.html

      # ── Deploy ──────────────────────────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
