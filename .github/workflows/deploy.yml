name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-3.1.64

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: ~/emsdk

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: web-build/_deps
          key: cmake-web-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (Emscripten)
        run: emcmake cmake -B web-build -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: emmake cmake --build web-build --parallel 4

      - name: Rename output to index.html
        run: cp web-build/CarromPhysics.html web-build/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
